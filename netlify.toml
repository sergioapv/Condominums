[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Netlify dashboard
  # under Site configuration → Environment variables.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
