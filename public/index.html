<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Condominums</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="setup" class="setup hidden">
    <div class="setup-card">
      <div class="setup-icon">🏢</div>
      <h1>Condominums</h1>
      <p class="setup-error">Backend not configured.</p>
      <p>Add these environment variables in your Netlify dashboard:</p>
      <pre>SUPABASE_URL
SUPABASE_SERVICE_KEY</pre>
      <p>Then trigger a new deploy.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🏢</span>
        <div>
          <strong>Condominums</strong>
          <small>Management</small>
        </div>
      </div>
      <div id="conn-status" class="conn-status">
        <span class="conn-dot"></span>
        <span class="conn-label">Checking…</span>
      </div>
      <nav id="nav">
        <a href="#/" data-page="dashboard" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#/units" data-page="units" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Units
        </a>
        <a href="#/residents" data-page="residents" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Residents
        </a>
        <a href="#/payments" data-page="payments" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Payments
        </a>
      </nav>
    </aside>
    <main id="content"></main>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="modal" class="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
